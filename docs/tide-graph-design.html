<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>바다가자 물때 그래프 디자인</title><style>
:root{--sea:#2F5D57;--amber:#C07B22;--cream:#FAF6EE;--line:#E5DCCB;--muted:#8A8277}*{box-sizing:border-box}body{margin:0;background:var(--cream);font-family:system-ui,'Noto Sans KR',sans-serif;color:#29241e}.wrap{max-width:1060px;margin:38px auto;padding:0 16px}.tide-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 24px;box-shadow:0 5px 24px #2f5d5709}.tide-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.eyebrow{font-size:12px;font-weight:700;color:var(--amber)}h2{font-size:23px;margin:4px 0 0}.tide-station{font-size:12px;color:var(--muted);padding-top:7px}.event-strip{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 10px}.event-pill{display:flex;align-items:center;gap:8px;padding:8px 11px;border-radius:10px;font-size:13px}.event-pill.low{background:#E3EFE9;color:var(--sea)}.event-pill.high{background:#FBEFDC;color:#B8761C}.event-pill b{font-size:16px;font-variant-numeric:tabular-nums}.graph-surface{background:#FAF6EE;border:1px solid #EFE8DC;border-radius:12px;padding:12px 8px 5px}.graph-surface svg{width:100%;height:auto;display:block}.tide-foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:12px;line-height:1.6}.tide-note{font-size:12px;color:var(--sea);margin-top:9px}@media(max-width:480px){.wrap{margin:12px auto;padding:0 12px}.tide-card{padding:16px 12px}.tide-head{align-items:center}h2{font-size:20px}.tide-station{font-size:11px;text-align:right}.event-strip{gap:6px;margin-top:16px}.event-pill{padding:7px 9px;gap:6px;font-size:12px}.event-pill b{font-size:14px}.graph-surface{padding:8px 4px 2px}}
</style></head><body><main class="wrap"><section class="tide-card" aria-label="오늘 시간별 물높이"><div class="tide-head"><div><div class="eyebrow">오늘의 바다</div><h2>시간별 물높이</h2></div><div class="tide-station">제주 관측소 기준</div></div><div class="event-strip" id="tideEvents" aria-label="간조 만조 시각"><span class="event-pill high">만조 <b>01:16</b></span><span class="event-pill low">간조 <b>08:16</b></span><span class="event-pill high">만조 <b>14:55</b></span><span class="event-pill low">간조 <b>21:32</b></span></div><div class="graph-surface" id="tideGraph"><svg viewBox="0 0 720 168" role="img" aria-label="물높이 그래프 예시"><defs><linearGradient id="seaFill" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#7CB4AD" stop-opacity=".44"/><stop offset="1" stop-color="#7CB4AD" stop-opacity=".025"/></linearGradient></defs><path d="M16 55 Q80 15 152 104 T324 38 T505 113 T708 55 V142 H16Z" fill="url(#seaFill)"/><path d="M16 55 Q80 15 152 104 T324 38 T505 113 T708 55" fill="none" stroke="#2F5D57" stroke-width="2.8" stroke-linecap="round"/><line x1="385" x2="385" y1="20" y2="142" stroke="#C07B22" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="364" y="1" width="42" height="22" rx="11" fill="#C07B22"/><text x="385" y="16" fill="white" font-size="12" font-weight="700" text-anchor="middle">지금</text><circle cx="152" cy="104" r="5" fill="#2F5D57" stroke="white" stroke-width="2"/><circle cx="324" cy="38" r="5" fill="#C07B22" stroke="white" stroke-width="2"/><circle cx="505" cy="113" r="5" fill="#2F5D57" stroke="white" stroke-width="2"/><g fill="#6B7680" font-size="12"><text x="16" y="162">0시</text><text x="362" y="162" text-anchor="middle">12시</text><text x="708" y="162" text-anchor="end">24시</text></g></svg></div><div class="tide-foot"><span id="tideSource">자료: 국립해양조사원 조석예보(시계열)</span><span>실제 방문 지점의 물때와 다를 수 있습니다.</span></div><div class="tide-note">간조는 녹색, 만조는 주황색으로 표시합니다.</div></section><p style="color:#8A8277;font-size:12px;margin-top:12px">디자인 미리보기: 곡선과 표시 위치는 예시이며 실제 물높이 데이터가 아닙니다. 기존 tide-graph.js의 계산 결과를 연결하세요.</p></main></body></html>
