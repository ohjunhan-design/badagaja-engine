     그러면 **가입 폼이 사라져 접수가 멈춥니다.**

<style>
  :root{--green:#2F5D57;--ink:#2B2317;--muted:#6B6256;--line:#E5DCCB}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;
    justify-content:center;padding:24px;
    background:linear-gradient(170deg,#EAF3FA,#F6FAFD 60%,#FFFBF3);
    color:var(--ink);
    font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,
      'Malgun Gothic',sans-serif;line-height:1.7}
  .box{max-width:520px;width:100%;padding:40px 32px;background:#fff;
    border:1px solid var(--line);border-radius:22px;
    box-shadow:0 10px 30px rgba(26,52,48,.08);text-align:center}
  .tag{display:inline-block;padding:5px 13px;border-radius:999px;
    background:#E5F0EE;color:var(--green);
    font-size:.8rem;font-weight:800;letter-spacing:.02em}
  h1{margin:18px 0 12px;font-size:1.55rem;line-height:1.35;
    font-weight:900;letter-spacing:-.02em;word-break:keep-all}
  p{margin:0 0 10px;font-size:.98rem;color:var(--muted);
    word-break:keep-all}
  .go{display:flex;align-items:center;justify-content:center;
    min-height:54px;margin-top:24px;padding:0 20px;border-radius:14px;
    background:var(--green);color:#fff;font-weight:800;font-size:1rem;
    text-decoration:none}
  .go:hover{background:#26514C}
  .small{margin-top:14px;font-size:.84rem;color:#9A9287}
  @media (max-width:390px){
    .box{padding:30px 20px;border-radius:18px}
    h1{font-size:1.3rem}
  }
</style>
</head>
<body>
  <main class="box">
    <span class="tag">바다가자 동호회</span>
    <h1>동호회는 바다가자닷컴으로<br>옮겼습니다</h1>

    <p>이제 <b>기존 동호회를 지원</b>합니다 —
       전용 게시판과 활동 공간을 무료로 만들어 드립니다.</p>
    <a class="go" href="https://badagaja.com/club/support.html">
      동호회 지원 보러 가기 →
    </a>
    <p class="small">잠시 뒤 자동으로 옮겨 갑니다.</p>
  </main>
<script>
  setTimeout(function () {
    location.replace('https://badagaja.com/club/support.html');
  }, 3000);
</script>
