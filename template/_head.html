<!DOCTYPE html>
<html lang="{{언어코드}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- PC 화면으로 보기 — 저장된 선택이면 폭을 1280 으로 (쪽이 그려지기 전에 해야 화면이 안 흔들립니다) -->
<script>try{if(localStorage.getItem("bdg-pcview")==="1"){document.querySelector('meta[name=viewport]').setAttribute("content","width=1280");document.documentElement.setAttribute("data-pcview","1")}}catch(e){}</script>
<title>{{제목}}</title>
<meta name="description" content="{{설명}}">
<!-- ★ 지금 판 — **보는 사람이 짐작하지 않게** (2026-10-07 주인 지시)
     사람이 읽는 것은 꼬리말에, 상세는 /build.json 에 있습니다. -->
<meta name="badagaja-build" content="{{판이름}}">
<meta name="badagaja-build-date" content="{{판날짜}}">
<link rel="canonical" href="{{정식주소}}">
{{{언어연결}}}
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{사이트이름}}">
<meta property="og:title" content="{{짧은제목}}">
<meta property="og:description" content="{{설명}}">
<meta property="og:url" content="{{정식주소}}">
<meta property="og:image" content="{{대표사진}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{짧은제목}}">
<meta name="twitter:description" content="{{설명}}">
<meta name="twitter:image" content="{{대표사진}}">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@300;400;500;600;700&family=Nanum+Gothic:wght@700;800&display=swap" rel="stylesheet">
<!-- 네이버 나눔스퀘어 네오는 **쓰지 않아** 뺐습니다 (2026-10-09).
     크롬으로 재니 실제 쓰이는 글꼴은 Noto Sans KR 429개 ·
     Noto Serif KR 24개 · Nanum Gothic 1개(로고)이고,
     나눔스퀘어 네오는 **0개**였습니다. 받기만 하고 한 글자도
     안 쓰니 449쪽이 바깥 집 하나에 괜히 연결했습니다.
     (engine/net.py 의 허락 목록은 옛 중국어판이 쓰므로 둡니다) -->
<link rel="stylesheet" href="{{차림표주소}}">

<link rel="shortcut icon" href="{{뿌리}}favicon.ico">
<link rel="icon" href="{{뿌리}}favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{뿌리}}apple-touch-icon.png">

</head>
