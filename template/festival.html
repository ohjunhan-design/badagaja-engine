{{#_head.html}}
<body data-festival="{{축제}}">
{{#_header.html}}

<section class="section hero section--soft"><div class="wrap">
  <nav class="breadcrumb" aria-label="여기가 어디인가">{{{길찾기}}}</nav>
  <div class="badge badge--orange">{{언제어디}}</div>
  <h1 class="serif">{{축제이름}}</h1>
  <p class="hero-lead">{{한줄}}</p>
  <div class="fest-facts">{{{한눈에}}}</div>

  {{{대표사진자리}}}
</div></section>

<section class="section section--white" id="about"><div class="wrap">
  <div class="section-head">
    <p class="kicker">이 축제는</p>
    <h2 class="serif">{{축제이름}}</h2>
  </div>
  <!-- ★ **두 칸으로 나눕니다** (2026-09-29 주인 지시)
       「비어있는 공간을 잘 활용해」 — 소개글이 왼쪽 좁은 칸에만 흐르고
       오른쪽 절반이 통째로 비어 있었습니다. 나란히 두면 세로가 줄고
       스크롤이 짧아집니다. 프로그램이 없으면 한 칸으로 돌아갑니다. -->
  <div class="two-col">
    <div class="two-col-a">{{{소개}}}</div>
    {{{프로그램}}}
  </div>
</div></section>

<section class="section" id="ganeun"><div class="wrap">
  <div class="section-head">
    <p class="kicker">가는 법</p>
    <h2 class="serif">어떻게 갈까요</h2>
  </div>
  {{{가는법}}}
  {{{알아둘것}}}
  {{{가까운곳}}}
</div></section>

<section class="section section--white" id="bada"><div class="wrap">
  <div class="section-head">
    <p class="kicker">축제 보러 간 김에</p>
    <h2 class="serif">바다도 보고 가세요</h2>
  </div>
  {{{바다이야기}}}
  <div class="two-up">{{{권역칸}}}</div>
</div></section>

<section class="section" id="dareun"><div class="wrap">
  <div class="section-head">
    <p class="kicker">가까운 다른 축제</p>
    <h2 class="serif">{{권역이름}}에서 또 열리는 것</h2>
    <!-- ★ 2026-10-01 주인 지시 「이런것들도 위치 조절하고」
         맨 아래 띄로 떨어져 있어 어느 칸 이야기인지 몰랐습니다. -->
    <p class="lead">{{기준일안내}}</p>
  </div>
  <div class="grid">{{{다른축제}}}</div>
</div></section>


<button class="to-top" id="toTop" aria-label="맨 위로">↑</button>
{{#_footer.html}}
