{{#_head.html}}
<body>
{{#_header.html}}

<!-- ★ **동호회 지원 쪽** (2026-10-09 주인 지시 · 지피티 상세 명세)

     「메인 카드에 이메일 주소가 직접 노출되어 있는데, 사용자가
       메일 보내기를 번거롭게 느낄 수 있으므로 직접 이메일 문의
       방식은 제거한다. 대신 지원 안내 + 샘플 + 신청 흐름으로 바꾼다」

     차례는 지피티가 정한 그대로입니다 —
       A 상단 hero  B 어떤 지원을 하나요  C 샘플 미리보기  D 신청 폼

     ★ 공개와 비공개를 가릅니다 (명세 9번)
       공개 : 안내 · 샘플 · 예시
       비공개 : 신청 내용. 공개 목록으로 내보내지 않습니다. -->

<!-- A. Hero — 지피티 실행팀 확정(2026-10-09)
       · 제목은 「이름 그대로」를 먼저 말합니다
       · 신뢰 문구는 **반드시** 들어갑니다 (이름·운영권 걱정이 가장 큽니다)
       · 단추는 둘 — 알아보기(버금) · 신청하기(으뜸) -->
<section class="club-hero" aria-labelledby="club-hero-title">
  <div class="club-hero__inner">
    <p class="club-hero__badge">{{배지}}</p>
    <h1 class="club-hero__title" id="club-hero-title">{{큰제목}}</h1>
    <p class="club-hero__lead">{{부제}}</p>
    <p class="club-hero__trust">{{신뢰문구}}</p>
    <ul class="club-hero__who">{{{누가}}}</ul>
    <div class="club-hero__cta">{{{단추}}}</div>
  </div>
</section>

<section class="section cs-gap section--white" id="club-support-what"><div class="wrap">
  <div class="section-head">
    <p class="kicker">무엇을 해 드리나</p>
    <h2 class="serif">어떤 지원을 하나요</h2>
    <p class="lead">{{지원안내}}</p>
  </div>
  <div class="cs-grid">{{{지원칸}}}</div>
</div></section>

<section class="section cs-gap section--soft"><div class="wrap">
  <div class="section-head">
    <p class="kicker">미리 보기</p>
    <h2 class="serif">이렇게 만들어 드립니다</h2>
    <p class="lead">{{샘플안내}}</p>
  </div>
  {{{샘플칸}}}
</div></section>

<div class="wrap g-ad">{{{광고칸}}}</div>

<section class="section cs-gap section--white" id="club-apply-form"><div class="wrap">
  <div class="section-head">
    <p class="kicker">마지막 한 걸음</p>
    <h2 class="serif">지원 신청하기</h2>
    <p class="lead">{{신청안내}}</p>
  </div>
  {{{신청폼}}}
</div></section>

<section class="section cs-gap section--tail"><div class="wrap">
  <p class="notice">{{기준일안내}}</p>
</div></section>

<button class="to-top" id="toTop" aria-label="맨 위로">↑</button>
{{#_footer.html}}
