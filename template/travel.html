{{#_head.html}}
<body{{{몸클래스}}}>
{{#_header.html}}

<!-- ★ **바다 여행 묶음 — 새로 짠 틀** (2026-10-07 바깥 검수 시안)

     옛 짜임의 두 가지를 고쳤습니다.

     ① **사진이 한 장도 없었습니다.**
        `rig-parts.html`(글만 있는 히어로)을 빌려 쓰고 있었습니다.
        주인 규칙 6-1 — 「사람은 눈으로 봅니다. 쪽에는 보이는 것이
        있어야 합니다. 바다 사이트에서 바다 사진이 없으면 첫인상이
        통째로 달라집니다」

     ② **권역 57개 목록이 세 번 되풀이됐습니다.**
        볼거리·먹거리·코스 갈래마다 한 벌씩이었습니다.
        바깥 검수 — 「없애는 게 맞습니다. 제 시안은 **갈래 3개는
        탭, 권역 선택은 단 한 벌**입니다」
        「핵심은 탭을 바꿔도 **권역 목록 DOM 을 다시 만들지 않는
          것**입니다」

     ★ 자바스크립트가 못 돌아도 쓸 수 있습니다 (계약-23)
       탭은 기본이 「볼거리」이고, 권역 링크는 그때도 명소 칸으로
       갑니다. JS 는 **해시만 갈아끼웁니다.** -->

<section class="section tv-hero"><div class="wrap">
  <article class="tv-hero-card">
    {{{대표사진자리}}}
    <div class="tv-hero-copy">
      <p class="kicker">{{한줄}}</p>
      <h1 class="serif">{{큰제목}}</h1>
      <p class="tv-hero-lead">{{소개글}}</p>
    </div>
  </article>
</div></section>

<!-- ★ 갈래 탭 — 숫자를 함께 보입니다 (주인 규칙 29: 자료에서 셉니다) -->
<section class="section tv-pick section--soft"><div class="wrap">
  <div class="tv-tabs" role="tablist" aria-label="무엇을 즐길까요">
    {{{갈래탭}}}
  </div>

  <div class="tv-region-head">
    <div>
      <p class="kicker">권역 선택</p>
      <h2 class="serif" id="tvGoal">{{첫갈래물음}}</h2>
    </div>
    <span class="tv-region-total">{{권역수글}}</span>
  </div>

  <!-- 광역으로 먼저 좁힙니다 — 57개를 한꺼번에 보면 고르기 어렵습니다 -->
  <div class="tv-provinces" role="group" aria-label="지역으로 좁히기">
    {{{광역단추}}}
  </div>

  <!-- ★ 이 목록은 쪽에 **단 한 번만** 있습니다 -->
  <div class="tv-regions" id="tvRegions">
    {{{권역한벌}}}
  </div>
  <!-- ★ **첫 화면에서만 접습니다** (2026-10-07 바깥 검수)
       「57개를 없애는 게 아니라 첫 화면에서만 접습니다」
       휴대폰에서만 보이고, 광역을 고르면 그 지역은 전부 보입니다. -->
  <button type="button" class="tv-more" id="tvMore"
          aria-expanded="false" aria-controls="tvRegions"
          data-all="{{권역수글}} 모두 보기">{{권역수글}} 모두 보기</button>
  <p class="tv-hint">{{고르기안내}}</p>
</div></section>

{{{갈래칸}}}

<section class="section section--tail"><div class="wrap">
  <p class="notice">{{기준일안내}}</p>
</div></section>

<button class="to-top" id="toTop" aria-label="맨 위로">↑</button>
{{#_footer.html}}
