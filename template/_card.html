    <article class="card" id="{{아이디}}" data-lat="{{위도}}" data-lng="{{경도}}" data-kind="{{지형코드}}">
      <div class="card-head">
        <h3 class="card-name">{{차례}}. {{이름}}</h3>
        {{{등급표}}}
      </div>
      <div class="card-tags">{{{이름표들}}}</div>
      <div class="card-body">{{{항목들}}}</div>
      {{{메모}}}
      <a class="maplink" href="{{지도주소}}" target="_blank" rel="noopener">지도에서 보기 →</a>
    </article>
