# 물때 자가 갱신 깨우기 — 손님이 없어도 돌게 합니다
#
# ★ 왜 (2026-10-14 주인 요구)
#   「꼭 자동화로 완성해놔. 매년 매월 매일 매시각 자동으로
#    나오도록, 중간에 내 개입이 없도록」
#
#   평상시에는 **손님이 올 때** 쪽이 서버에 갱신을 부탁합니다.
#   그런데 **손님이 오래 없으면** 아무도 부탁하지 않아 자료가
#   낡습니다(새벽·비수기). 그 빈틈을 이 일꾼이 메웁니다.
#
# ★ 하는 일은 **주소 하나를 두드리는 것뿐**입니다.
#   받아오고 검증하고 바꾸는 일은 전부 서버가 합니다.
#   · 비밀값이 **필요 없습니다** — 공개 암호를 씁니다.
#     그 암호로는 `only=` 를 못 쓰고 **최소 간격을 반드시**
#     지키므로, 여기 적혀 있어도 서버가 할 일이 안 늘어납니다.
#   · 실패해도 **아무 일도 일어나지 않습니다**(서버가 그대로 둡니다)
#
# ★ 지금은 **켜져 있지 않습니다.**
#   정기 실행(schedule)은 아래에 적어 두고 주석 처리했습니다.
#   main 에 넣고 켜는 것은 감독실이 주인 승인을 받은 뒤입니다.
name: 물때 깨우기

on:
  workflow_dispatch:
# ★ 승인 뒤 아래 주석을 풀면 **네 시간마다** 깨웁니다.
#   (한국 시간 02·06·10·14·18·22시 — 새벽이 들어 있습니다)
#   schedule:
#     - cron: '0 1,5,9,13,17,21 * * *'   # UTC

concurrency:
  group: tide-poke
  cancel-in-progress: false

jobs:
  깨우기:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 깨우기 (여러 걸음)
        run: |
          # ★ 한 번 두드리면 서버가 **한 걸음**(권역 하나·열흘치)만
          #   갑니다. 최소 간격이 7분이므로, 간격을 두고 여러 번
          #   두드려 몇 걸음 나아가게 합니다.
          #   서버가 「아직 이릅니다」를 돌려주면 그냥 넘어갑니다.
          URL="https://badagaja.com/api/tide-refresh.php?t=bdg-refresh-pub-20261014"
          for i in 1 2 3 4 5 6 7 8; do
            echo "--- $i 번째 ---"
            curl -s --max-time 120 "$URL" || echo "(못 두드렸습니다)"
            echo
            if [ "$i" -lt 8 ]; then sleep 430; fi
          done

      - name: 지금 상태
        if: always()
        run: |
          curl -s --max-time 60 \
            "https://badagaja.com/api/tide-refresh.php?status=1" \
            | head -c 2000 || echo "(상태를 못 읽었습니다)"
