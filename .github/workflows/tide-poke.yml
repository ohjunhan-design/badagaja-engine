# 물때 자가 갱신 깨우기 — 손님이 없어도 돌게 합니다
#
# ★ 왜 (2026-10-14 주인 요구)
#   「꼭 자동화로 완성해놔. 매년 매월 매일 매시각 자동으로
#    나오도록, 중간에 내 개입이 없도록」
#
#   평상시에는 **손님이 올 때** 쪽이 서버에 갱신을 부탁합니다.
#   그런데 **손님이 오래 없으면** 아무도 부탁하지 않아 자료가
#   낡습니다(새벽·비수기). 그 빈틈을 이 일꾼이 메웁니다.
#
# ★ 하는 일은 **주소 한 번 두드리기**입니다.
#   받아오고 검증하고 바꾸는 일은 전부 서버가 합니다.
#   · 비밀값이 **필요 없습니다** — 공개 암호를 씁니다.
#     그 암호로는 `only=` 를 못 쓰고 **최소 간격을 반드시**
#     지키므로, 여기 적혀 있어도 서버가 할 일이 안 늘어납니다.
#   · 실패해도 **아무 일도 일어나지 않습니다**(서버가 그대로 둡니다)
#
# ★ 한 번에 **한 걸음**만 (2026-10-14 감사 지적 — 중요)
#   처음에는 7분씩 쉬며 여덟 걸음을 걷게 했습니다. 그런데
#   한 번 도는 데 **50분**이라 하루 6번이면 월 **9,000분**입니다.
#   게다가 `timeout-minutes` 가 루프보다 짧아 **매번 20분에
#   취소**될 참이었습니다. 그래서 **한 번 두드리고 끝냅니다.**
#       한 번 약 1분 × 하루 6번 × 30일 = 월 **약 180분**
#
#   ★ 처음에는 「비공개라 한도 2,000분」이라 적었는데 **틀렸습니다.**
#     이 저장소는 **공개**(ohjunhan-design/badagaja-engine)이고,
#     공개 저장소의 Actions 는 **무료 무제한**입니다. 확인하지 않고
#     적었습니다. 그래도 한 걸음으로 두는 까닭은 따로 있습니다 —
#     **걸음이 이미 넉넉하고**(아래), 많이 두드려 봐야 서버가
#     7분 간격으로 막으며, 정부 API 를 괜히 재촉하지 않기 위해서입니다.
#
# ★ 걸음 수가 모자라지 않은가
#   하루 6걸음 × 30일 = **180걸음**.
#   한 달에 한 번 60일치를 새로 채우는 데 드는 것이
#   57권역 × 3구간 = **171걸음** 이라 **넉넉합니다.**
#   게다가 **손님이 올 때의 부탁**이 함께 돌아 더 빨리 찹니다.
#
# ★ 켰습니다 (2026-10-14 주인 승인 「그래 진행하자」)
#   끄려면 아래 `schedule:` 두 줄을 주석 처리하거나,
#   깃허브 Actions 에서 이 워크플로를 Disable 합니다.
#   ★ 꺼도 **손님이 올 때의 자동 갱신은 그대로 돕니다.**
name: 물때 깨우기

on:
  workflow_dispatch:
  schedule:
    # 한국 시간 02·06·10·14·18·22시 (네 시간마다 · 새벽 포함)
    - cron: '0 1,5,9,13,17,21 * * *'   # UTC

concurrency:
  group: tide-poke
  cancel-in-progress: false

jobs:
  poke:        # ★ 작업 ID 는 **영문만** 됩니다
            #   한글(`깨우기`)로 두었더니 워크플로가 통째로
            #   무효가 되어 **0초 만에 실패**했습니다.
            #   (아래 단계의 `name:` 은 한글이어도 됩니다)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 한 걸음 깨우기
        run: |
          # 서버가 **한 걸음**(권역 하나·열흘치) 갑니다.
          # 「아직 이릅니다」나 「다른 갱신이 도는 중」이 와도
          # 정상입니다 — 다음 번에 이어 갑니다.
          curl -s --max-time 120 \
            "https://badagaja.com/api/tide-refresh.php?t=bdg-refresh-pub-20261014" \
            || echo "(못 두드렸습니다 — 다음 번에 다시 합니다)"
          echo

      - name: 지금 상태
        if: always()
        run: |
          curl -s --max-time 60 \
            "https://badagaja.com/api/tide-refresh.php?status=1" \
            | head -c 2000 || echo "(상태를 못 읽었습니다)"
