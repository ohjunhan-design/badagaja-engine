# 바깥에서 사이트가 어떻게 보이는지 — **1분짜리 진단**
#
# ★ 왜 (2026-09-28)
#
#   검증 배포 20번 검사에서 이런 일이 났습니다.
#
#                            이 컴퓨터(한국)   깃허브 러너(해외)
#     _stage/index.html          200              200
#     _stage/assets/css/site.css 200            **404**
#     _stage/assets/js/tide.js   200            **404**
#     _stage/favicon.svg         200              200
#
#   확장자로 갈립니다. 속도 제한이 아닙니다.
#   사실이라면 **구글봇도 css·js 를 못 읽습니다** — 구글봇은
#   해외에서 옵니다. 쪽은 읽히는데 꾸밈과 동작이 빠진 채로
#   보이면, 구글은 「쓸 만한 쪽」으로 안 봅니다 (주인 규칙 28).
#
#   운영 쪽도 같은지 함께 봅니다. 같다면 이것은 새 사이트 일이
#   아니라 **지금 운영 중인 사이트의 일**입니다.
#
# ★ 셸 변수 이름은 **영어로** 씁니다 (2026-09-28 처음 돌릴 때 걸림)
#
#     볼것="..."   →  line 15: 볼것=  (명령을 못 찾습니다)
#
#   환경변수 이름 때와 같은 이야기입니다. 리눅스 셸도, 깃허브
#   액션 식도 한글을 못 씁니다. **주석과 name: 은 한글로 두되,
#   셸 변수·식별자는 영어로** 적습니다.
name: 바깥에서 어떻게 보이나

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: 바깥에서 보기
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 어디서 재는지
        run: |
          echo "나가는 주소: $(curl -s --max-time 20 https://api.ipify.org || echo 모름)"

      - name: 운영 쪽과 검증 칸을 함께 봅니다
        run: |
          paths="
          /
          /index.html
          /taean.html
          /css/style.css
          /js/app.js
          /favicon.svg
          /robots.txt
          /sitemap.xml
          /_stage/index.html
          /_stage/assets/css/site.css
          /_stage/assets/js/tide.js
          /_stage/assets/js/ads.js
          /_stage/favicon.svg
          "
          printf '%-42s %-6s %-9s %s\n' 주소 코드 크기 종류
          for p in $paths; do
            out=$(curl -s -o /dev/null --max-time 25 \
                  -w '%{http_code} %{size_download} %{content_type}' \
                  "https://badagaja.com$p" || echo "못받음 0 -")
            printf '%-42s %s\n' "$p" "$out"
          done

      - name: 같은 파일을 여러 이름표로 물어봅니다
        run: |
          # 사람이 쓰는 브라우저처럼 물으면 달라지는지 봅니다
          for ua in "badagaja-deploy-check" \
                    "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120" \
                    "Googlebot/2.1 (+http://www.google.com/bot.html)" \
                    ""; do
            code=$(curl -s -o /dev/null --max-time 25 -w '%{http_code}' \
                   -A "$ua" https://badagaja.com/_stage/assets/css/site.css)
            printf '%-50s %s\n' "${ua:-（이름표 없음）}" "$code"
          done

      - name: 헤더를 그대로 봅니다
        run: |
          echo "── /_stage/assets/css/site.css ──"
          curl -s -I --max-time 25 https://badagaja.com/_stage/assets/css/site.css || true
          echo ""
          echo "── /css/style.css (운영) ──"
          curl -s -I --max-time 25 https://badagaja.com/css/style.css || true
