# 되돌리기 연습 — **정말 되돌아가는지** 검증 자리에서 해 봅니다
#
# ★ 왜 (2026-09-28 바깥 검수 10차)
#
#     「백업 파일이 있다」와 「그 백업으로 사이트를 복구할 수 있다」는
#     **완전히 다른 이야기입니다.**
#     rollback 은 FTP 복사 작업이 아니라 **하나의 배포**입니다.
#
#   지금까지 우리는 되돌리기 코드를 적어 두기만 했습니다.
#   한 번도 정말 되돌아가는지 본 적이 없습니다.
#   급할 때 안 되는 되돌리기는 없는 것입니다.
#
# ★ 어떻게
#
#     1  지금 검증 자리(_stage)를 통째로 받아 둡니다      ← A판
#     2  일부러 망가뜨린 판을 올립니다                     ← B판
#        (쪽을 하나 지우고, 자산 하나를 비웁니다)
#     3  검사가 **정말 걸러내는지** 봅니다
#        — 안 걸리면 검사가 무른 것이니 거기서 멈춥니다
#     4  A판으로 되돌립니다
#     5  되돌린 뒤 **판정까지** 합니다
#        — 지문이 A판과 같은가 · 쪽·자산·사진이 200 인가
#
#   운영은 한 글자도 안 건드립니다. /www/_stage/ 안에서만 합니다.
name: 되돌리기 연습

on:
  workflow_dispatch:
    inputs:
      folder:
        description: '연습할 칸 (기본 _stage)'
        required: false
        default: _stage

concurrency:
  group: ftp-stage
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drill:
    name: 되돌리기 연습
    runs-on: ubuntu-latest
    # ★ **셸을 bash 로 못 박습니다** (2026-09-30)
    #
    #   윈도우 러너에서는 `run:` 이 기본으로 **파워셸**로 돕니다.
    #   그런데 우리 일꾼 글은 전부 셸(bash) 문법입니다.
    #       if [ -z "$X" ]; then …
    #   파워셸은 이것을 못 읽고 「'if' 뒤에 '('가 없습니다」로 죽습니다.
    #
    #   윈도우에도 **깃 배시**가 있어 bash 를 쓸 수 있습니다.
    #   이렇게 못 박으면 **우분투와 윈도우가 같은 글을 씁니다** —
    #   일꾼을 두 벌로 나누지 않아도 됩니다.
    #
    #   파워셸이 꼭 필요한 단계(크롬 찾기·파이썬 보기)는
    #   그 단계에만 `shell: pwsh` 를 따로 적었습니다.
    defaults:
      run:
        shell: bash
    timeout-minutes: 60

    env:
      TZ: Asia/Seoul
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: '1'

    steps:
      - uses: actions/checkout@v4
      # ★ **우분투일 때만 깝니다** (2026-09-30)
      #   setup-python 도 윈도우에서 레지스트리를 건드려
      #   관리자가 아닌 셀프 호스티드 러너에서는 죽습니다.
      #   내 컴퓨터에는 파이썬 3.12 가 이미 있습니다.
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: '3.12'

      # ★ 윈도우에서는 **있는 파이썬이 쓸 만한지 봅니다**
      #   3.12 가 아니면 거기서 멈춥니다 — 딴 판으로 재면
      #   내 컴퓨터와 결과가 어긋납니다.
      - name: 파이썬 보기 (윈도우)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = (python --version 2>&1) -replace 'Python ',''
          Write-Output "파이썬 $v"
          if (-not $v.StartsWith('3.12')) {
            Write-Output "::error::파이썬 3.12 가 아닙니다 ($v) — 딴 판으로 재면 결과가 어긋납니다"
            exit 1
          }

      - name: 올릴 칸을 정합니다
        env:
          FOLDER: ${{ github.event.inputs.folder }}
        run: |
          CARD="${FOLDER:-_stage}"
          # ★ 목숨이 걸린 줄입니다 — 빈 이름이면 /www/ 전체를 건드립니다
          case "$CARD" in
            ""|/*|*..*|*" "*|www)
              echo "::error::칸 이름이 이상합니다: [$CARD]"; exit 1 ;;
          esac
          echo "CARD=$CARD" >> "$GITHUB_ENV"
          echo "연습할 곳: /www/$CARD  (운영은 안 건드립니다)"

      # ★ **쪽을 먼저 만듭니다** (2026-09-28 — 첫 연습에서 드러남)
      #
      #   smoke.py 는 「내가 만든 것과 서버 것을 견주는」 검사입니다.
      #   그런데 이 연습에는 쪽 만들기가 없어 site/ 가 비었고,
      #   smoke.py 가 이렇게 죽었습니다.
      #
      #       site/assets/js/tide.js — MISSING (파일이 없습니다)
      #
      #   견줄 것이 없으면 견줄 수 없습니다.
      - name: 쪽 만들기
        run: python engine/build.py

      - name: lftp 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # ── 1. A판을 받아 둡니다
      - name: 1단계 — 지금 것을 받아 둡니다 (A판)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          mkdir -p _A
          lftp -c "
            set ftp:ssl-allow no;
            set ftp:list-options -a;
            set ftp:charset utf-8;
            set file:charset utf-8;
            set net:max-retries 3;
            open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\";
            mirror --parallel=4 /www/$CARD/ _A/;
          " || { echo "::error::A판을 못 받았습니다"; exit 1; }
          echo "A판 파일 $(find _A -type f | wc -l)개 · $(du -sh _A | cut -f1)"
          (cd _A && find . -type f -exec sha256sum {} \; | sort) > _A.sha256
          echo "A판 지문 $(wc -l < _A.sha256)줄"

      # ── 2. 일부러 망가뜨린 B판
      - name: 2단계 — 일부러 망가뜨린 판을 만듭니다 (B판)
        run: |
          cp -r _A _B
          echo "── 망가뜨리는 것"
          # (가) 쪽 하나를 지웁니다 — 손님이 404 를 봅니다
          rm -f _B/taean.html && echo "   · taean.html 을 지웠습니다"
          # (나) 자산 하나를 비웁니다 — 꾸밈이 사라집니다
          : > _B/assets/css/site.css && echo "   · site.css 를 비웠습니다"
          # ★ (나-2) **새 쪽을 더합니다** (2026-10-07)
          #
          #   연습은 지금껏 **지우기·비우기·지문 흔들기**만 했습니다.
          #   그래서 **새로 생긴 파일**이 되돌릴 때 지워지는지를
          #   **한 번도 본 적이 없습니다.**
          #
          #   바깥 검수 — 「새 파일 삭제까지 포함해 **exact rollback**
          #   검증」. 이것이 없으면 「되돌렸다」가 「덮어썼다」일 뿐입니다.
          #
          #   실제로 운영 배포의 되돌리기에는 --delete 가 **없어서**
          #   새 쪽이 그대로 남습니다. 연습(여기)에는 있습니다 —
          #   **연습과 실전이 다릅니다.** 그 어긋남도 이 판에서 드러납니다.
          mkdir -p _B/연습임시
          echo "<p>되돌리면 사라져야 합니다</p>" > _B/새로생긴쪽.html
          echo "<p>폴더째 사라져야 합니다</p>" > _B/연습임시/속.html
          echo "   · 새로 생긴 쪽 둘을 더했습니다 (되돌리면 없어져야 합니다)"
          # (다) 판 지문을 흔듭니다 — 올린 것이 만든 것과 달라집니다
          if [ -f _B/build.json ]; then
            python -c "import json,io;p='_B/build.json';d=json.load(io.open(p,encoding='utf-8'));d['통지문']='0'*64;io.open(p,'w',encoding='utf-8').write(json.dumps(d,ensure_ascii=False,indent=2))"
            echo "   · build.json 의 통지문을 흔들었습니다"
          fi

      - name: 2단계 — B판을 올립니다
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-allow no;
            set ftp:list-options -a;
            set ftp:charset utf-8;
            set file:charset utf-8;
            set net:max-retries 3;
            open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\";
            mirror -R --delete --parallel=4 _B/ /www/$CARD/;
          "
          echo "· 망가진 판을 올렸습니다"

      # ── 3. 검사가 정말 걸러내는가
      - name: 3단계 — 검사가 이것을 걸러내는가
        run: |
          export BADAGAJA_URL="https://badagaja.com/$CARD"
          export BADAGAJA_URL_ROOT="https://badagaja.com"
          echo "── 걸러내야 정상입니다"

          # ★ **죽은 것과 걸러낸 것은 다릅니다** (2026-09-28)
          #
          #   첫 연습에서 이 단계가 「제대로 걸러냈습니다」라고 했는데,
          #   사실은 smoke.py 가 site/ 가 없어 **죽은 것**이었습니다.
          #   끝난값만 보면 둘이 같아 보입니다.
          #
          #   죽은 검사기는 아무것도 재지 못했습니다.
          #   그것을 「걸러냈다」고 세면, 연습이 확인하려던 바로 그것을
          #   확인하지 못합니다. 오늘 하루 내내 본 얼굴입니다.
          set +e
          python engine/smoke.py --net --판지문묻지않기 > _smoke.txt 2>&1
          # ★ 셸 변수 이름은 영어로 (검사 7 이 잡았습니다)
          #   run: 안의 한글 변수는 그 줄에서 죽습니다.
          RC=$?
          set -e
          tail -30 _smoke.txt
          if grep -q 'Traceback (most recent call last)' _smoke.txt; then
            echo "::error::**검사기가 죽었습니다 — 걸러낸 것이 아닙니다**"
            echo "  망가진 판을 걸러냈는지 알 수 없습니다."
            sed -n '/Traceback/,$p' _smoke.txt | head -12
            echo "NEEDFIX=1" >> "$GITHUB_ENV"
          elif [ "$RC" = "0" ]; then
            echo "::error::**망가진 판을 검사가 통과시켰습니다**"
            echo "  되돌리기를 시험하기 전에 검사부터 고쳐야 합니다."
            echo "  (그대로 두면 운영에서도 못 걸러냅니다)"
            echo "NEEDFIX=1" >> "$GITHUB_ENV"
          else
            echo "· 검사가 제대로 걸러냈습니다 (끝난값 $RC · 안 죽었습니다)"
          fi

      # ── 4. 되돌립니다
      # ── 3.5 **새 되돌리기 방식을 나란히 재 봅니다** (2026-10-08)
      #
      #   지금 4단계는 `mirror -R --delete` 로 통째로 덮습니다.
      #   그것은 **서버에 있는데 내 손에 없는 것을 모두 지웁니다** —
      #   손으로 올린 파일, api/, 옛 자산까지. 운영에서는 쓸 수
      #   없는 방식이라 지금도 운영 되돌리기에는 --delete 가 빠져
      #   있고, 그래서 **이번 판에만 생긴 파일이 서버에 남습니다.**
      #
      #   새 방식은 `build.json` 두 판을 견주어 **지울 것을 셈으로**
      #   정합니다. 바꾸기 전에 **그 셈이 진짜와 맞는지** 여기서
      #   재 봅니다 — 연습 칸의 A판·B판은 우리가 만든 것이라
      #   「무엇이 늘었는지」를 이미 알고 있습니다.
      #
      #   ★ 아직 **재 보기만 합니다.** 실제 되돌리기는 4단계가
      #     그대로 합니다. 셈이 맞는 것을 여러 번 본 뒤에 바꿉니다.
      - name: 3.5단계 — 새 되돌리기 셈이 진짜와 맞는가
        if: always()
        continue-on-error: true
        run: python engine/drill_compare.py _A _B
      - name: 4단계 — A판으로 되돌립니다
        if: always()
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-allow no;
            set ftp:list-options -a;
            set ftp:charset utf-8;
            set file:charset utf-8;
            set net:max-retries 3;
            open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\";
            mirror -R --delete --parallel=4 _A/ /www/$CARD/;
          "
          echo "· 파일을 되돌렸습니다"

      # ── 5. 되돌린 뒤 **판정까지**
      - name: 5단계 — 정말 A판으로 돌아왔는가
        if: always()
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          BAD=0

          echo "── (가) 파일 지문이 A판과 같은가"
          mkdir -p _after
          lftp -c "
            set ftp:ssl-allow no;
            set ftp:list-options -a;
            set ftp:charset utf-8;
            set file:charset utf-8;
            set net:max-retries 3;
            open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\";
            mirror --parallel=4 /www/$CARD/ _after/;
          "
          (cd _after && find . -type f -exec sha256sum {} \; | sort) > _after.sha256
          if diff -q _A.sha256 _after.sha256 >/dev/null; then
            echo "   · 파일 $(wc -l < _A.sha256)개가 모두 A판과 같습니다"
          else
            echo "   ✗ A판과 다릅니다"
            diff _A.sha256 _after.sha256 | head -10
            BAD=1
          fi

          echo ""
          echo "── (나) 사이트가 살아 있는가"
          for U in / /taean.html /assets/css/site.css /build.json; do
            C=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 \
                "https://badagaja.com/$CARD$U")
            printf '   %-28s %s\n' "$U" "$C"
            [ "$C" = "200" ] || BAD=1
          done

          # ★ **새로 생긴 것이 정말 사라졌는가** (2026-10-07)
          #   (가)의 지문 견주기가 이미 잡습니다. 그래도 눈으로도
          #   보이게 둡니다 — 되돌림의 뜻이 바로 이것이기 때문입니다.
          echo ""
          echo "── 새로 생긴 것이 사라졌는가 (404 여야 맞습니다)"
          for U in /새로생긴쪽.html /연습임시/속.html; do
            C=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 \
                "https://badagaja.com/$CARD$U")
            printf '   %-28s %s' "$U" "$C"
            if [ "$C" = "404" ]; then
              echo "  · 사라졌습니다"
            else
              echo "  ✗ **남아 있습니다** — 덮어썼을 뿐 되돌린 것이 아닙니다"
              BAD=1
            fi
          done

          echo ""
          echo "── (다) 검사가 이제 통과하는가"
          # ★ 판 지문은 묻지 않습니다 (2026-09-28 — 연습 #2 에서 드러남)
          #   서버는 **옛 판**으로 돌아가 있습니다. 그것이 지금 코드로
          #   만든 것과 같을 까닭이 없습니다. 같아야 하는 것은
          #   「A판과 같은가」이고, 그것은 (가) 가 이미 봤습니다.
          export BADAGAJA_URL="https://badagaja.com/$CARD"
          export BADAGAJA_URL_ROOT="https://badagaja.com"
          python engine/smoke.py --net --판지문묻지않기 || BAD=1

          echo ""
          if [ "$BAD" != "0" ]; then
            echo "::error::**되돌렸는데 A판으로 돌아오지 않았습니다**"
            echo "  이대로면 급할 때 되돌리기가 안 됩니다."
            exit 1
          fi
          if [ "${NEEDFIX:-0}" = "1" ]; then
            echo "::error::되돌리기는 됐지만 **검사가 망가진 판을 통과시켰습니다**"
            exit 1
          fi
          echo "· 되돌리기가 정말 됩니다."
          echo "  「백업이 있다」가 아니라 「복구된다」를 확인했습니다."

      - name: 결과 남기기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 되돌리기연습
          path: |
            _A.sha256
            _after.sha256
          retention-days: 30
