# 운영 배포 — badagaja.com 뿌리로 올립니다
#
# ★ 이것은 **손님이 보는 자리**에 올리는 일입니다.
#   검증 배포(stage.yml)와 달리 되돌릴 시간이 없습니다.
#   그래서 문을 여럿 둡니다.
#
#   ① 손으로만 돌립니다 (push 로 저절로 돌지 않습니다)
#   ② 「배포합니다」라고 **정확히 쳐야** 합니다
#   ③ 판정이 GO 여야 합니다 — 아니면 거기서 멈춥니다
#   ④ 검증판 표시가 남아 있으면 멈춥니다
#      (그대로 나가면 416쪽이 검색에서 통째로 사라집니다)
#   ⑤ 올리기 전에 **지금 서버를 통째로 내려받아 둡니다**
#      되돌릴 것이 없으면 되돌리기도 없습니다
#   ⑥ 올린 뒤 20번을 재고, 나쁘면 **스스로 되돌립니다**
#
# ★ 올리는 차례 (바깥 검수 9차 숙제 6)
#      1 자산 → 2 쪽 → 3 솎기 → 4 판 지문
#   719개를 올리는 데 4분 남짓 걸립니다. 그 사이에 들어온 손님이
#   「쪽은 새것인데 꾸밈이 없는」 화면을 보지 않게 하려는 차례입니다.
name: 운영 배포

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '정말 올리려면 「배포합니다」 라고 치세요'
        required: true
        default: ''
      # ★ **판정을 건너뛰는 입력은 두지 않습니다** (2026-10-07 바깥 검수)
      #   전에는 skip_gate: 'yes' 로 판정을 끌 수 있었습니다.
      #   바깥 검수 — 「배포하려면 **반드시** full gate 를 통과해야
      #   한다는 것이 이 구조의 장점입니다. **우회로**가 남아 있으면
      #   **안전장치를 사람이 끌 수 있는 구조**가 계속 존재합니다」
      #   급해도 끄지 않습니다. 느린 것보다 **잘못 올리는 것**이 큽니다.

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: 운영 배포
    # ★ 어느 컴퓨터에서 돌지 **한 곳에서 정합니다** (2026-09-30)
    #   저장소 변수 RUNNER_LABEL 이 있으면 그것을 씁니다.
    #   없으면 예전처럼 깃허브 우분투입니다.
    #   셀프 호스티드 러너를 붙이면 RUNNER_LABEL 에
    #   self-hosted 를 넣기만 하면 됩니다 — 일꾼 파일은
    #   다시 안 고칩니다.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    # ★ **셸을 bash 로 못 박습니다** (2026-09-30)
    #
    #   윈도우 러너에서는 `run:` 이 기본으로 **파워셸**로 돕니다.
    #   그런데 우리 일꾼 글은 전부 셸(bash) 문법입니다.
    #       if [ -z "$X" ]; then …
    #   파워셸은 이것을 못 읽고 「'if' 뒤에 '('가 없습니다」로 죽습니다.
    #
    #   윈도우에도 **깃 배시**가 있어 bash 를 쓸 수 있습니다.
    #   이렇게 못 박으면 **우분투와 윈도우가 같은 글을 씁니다** —
    #   일꾼을 두 벌로 나누지 않아도 됩니다.
    #
    #   파워셸이 꼭 필요한 단계(크롬 찾기·파이썬 보기)는
    #   그 단계에만 `shell: pwsh` 를 따로 적었습니다.
    defaults:
      run:
        shell: bash
    timeout-minutes: 90

    env:
      TZ: Asia/Seoul
      LANG: ko_KR.UTF-8
      LC_ALL: ko_KR.UTF-8
      # ★ **옛 사이트를 저장소 안에서 봅니다** (2026-09-28)
      #   클라우드에는 옛 사이트가 없어, 검사기 셋이
      #   「볼 것이 0개 = 걸린 것도 0개」로 조용히 통과했습니다.
      #   engine/make_oldsite.py 로 떠 둔 쪽을 봅니다.
      BADAGAJA_OLD: ${{ github.workspace }}/oldsite
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: '1'
      BADAGAJA_URL: https://badagaja.com
      BADAGAJA_URL_ROOT: https://badagaja.com
      # ★ **그림자 장부를 체크아웃 밖에 둡니다** (2026-10-08)
      #   일꾼은 배포마다 저장소를 **새로 받습니다.** 그래서 일꾼이
      #   `tests/golden/그림자장부.json` 에 적은 줄은 그 배포가
      #   끝나면 사라집니다. 배포 #29 가 성공했는데 장부에 그 줄이
      #   없는 것으로 들통났습니다 — **연속 3회가 영영 안 쌓이는**
      #   상태였습니다.
      #
      #   ★ **`env:` 에서는 `runner.*` 를 못 씁니다** (2026-10-08에 겪음)
      #     처음에 `${{ runner.workspace }}` 로 적었다가 워크플로가
      #     통째로 깨졌습니다 —
      #         Invalid workflow file (Line 92):
      #         Unrecognized named-value: 'runner'
      #     깨진 워크플로는 **푸시마다 실패 기록**을 남기고, 그
      #     사이 배포를 걸 수도 없습니다. 여섯 번 그랬습니다.
      #     `runner` 컨텍스트는 **단계 안**에서만 살아 있습니다.
      #   ★ **`github.workspace` 도 안전하지 않습니다** (바깥 검수)
      #     「github.workspace 는 **checkout 작업 디렉터리**라,
      #       actions/checkout 이 clean/reset 하면 그 안의 장부가
      #       지워질 수 있습니다. 배포마다 살아남아야 하는 장부라면
      #       checkout 밖의 **self-hosted runner 영속 디렉터리**나
      #       artifact/cache 쪽이 더 맞습니다」
      #     그래서 여기서 적지 않고 **단계 안에서** 셈해
      #     `$GITHUB_ENV` 로 넘깁니다 — 단계에서는 `runner.*` 가
      #     살아 있습니다 (작업 수준 env 에서는 못 씁니다).

    steps:
      # ── ① 정말 올릴 것인지
      - name: 다짐을 받습니다
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "배포합니다" ]; then
            echo "::error::「배포합니다」 라고 정확히 쳐야 올립니다 (친 것: $CONFIRM)"
            exit 1
          fi
          echo "· 다짐을 받았습니다"

      # ── ★ **그림자 장부 자리를 단계 안에서 셉니다** (2026-10-08)
      #   `runner.temp` 는 **작업마다 지워지고**, `github.workspace`
      #   는 checkout 이 clean/reset 할 수 있습니다. 둘 다 장부에는
      #   못 씁니다. 일꾼 집(`RUNNER_WORKSPACE` 의 윗자리)은
      #   체크아웃이 건드리지 않습니다.
      #   ★ 여기(step)에서는 `runner.*` 가 살아 있습니다 —
      #     작업 수준 `env:` 에서 쓰면 워크플로가 통째로 거절됩니다.
      - name: 그림자 장부 자리를 정합니다
        run: |
          # ★ **셸 변수 이름은 한글로 짓지 않습니다** (2026-10-08에 겪음)
          #   `밭="..."` 라고 썼더니 bash 가 그것을 **명령으로** 읽어
          #   `exit code 127`(명령 없음)로 배포가 3초 만에 죽었습니다.
          #       line 1: 밭=/home/runner/work/...: No such file or directory
          #   파이썬은 한글 이름을 받지만 셸은 못 받습니다.
          #   이 저장소는 파이썬 변수를 한글로 쓰는데, **셸만은 다릅니다.**
          TALLY_DIR="${RUNNER_WORKSPACE:-$GITHUB_WORKSPACE/..}/.."
          TALLY_DIR="$(cd "$TALLY_DIR" 2>/dev/null && pwd || echo /tmp)"
          TALLY="$TALLY_DIR/badagaja-shadow-tally.json"
          echo "BADAGAJA_TALLY=$TALLY" >> "$GITHUB_ENV"
          echo "· 장부 자리 — $TALLY"
          if [ -f "$TALLY" ]; then
            echo "· 지난 장부가 살아 있습니다 ($(wc -c < "$TALLY") 바이트)"
          else
            echo "· 장부가 아직 없습니다 — 이번부터 쌓입니다"
          fi

      - uses: actions/checkout@v4
      # ★ **우분투일 때만 깝니다** (2026-09-30)
      #   setup-python 도 윈도우에서 레지스트리를 건드려
      #   관리자가 아닌 셀프 호스티드 러너에서는 죽습니다.
      #   내 컴퓨터에는 파이썬 3.12 가 이미 있습니다.
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: '3.12'
      # ★ **PyYAML 을 깝니다** (2026-10-08 — 배포 #41 이 여기서 막혔습니다)
      #   `setup-python` 은 깨끗한 파이썬을 깝니다. 제 윈도우에는
      #   PyYAML 이 있어 시험이 다 통과했는데, 우분투에는 없어서
      #   `check_workflow.py` 가 짜임 검사를 **건너뛰고 통과**했습니다.
      #   클라우드에서 검사가 안 도는데 통과로 보이는 것이
      #   가장 나쁜 꼴입니다 (기억 「클라우드 판정이 로컬과 다를 때」).
      - name: 파이썬 꾸러미를 깝니다
        shell: bash
        run: python -m pip install --quiet --disable-pip-version-check PyYAML Pillow

      # ★ 윈도우에서는 **있는 파이썬이 쓸 만한지 봅니다**
      #   3.12 가 아니면 거기서 멈춥니다 — 딴 판으로 재면
      #   내 컴퓨터와 결과가 어긋납니다.
      - name: 파이썬 보기 (윈도우)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = (python --version 2>&1) -replace 'Python ',''
          Write-Output "파이썬 $v"
          if (-not $v.StartsWith('3.12')) {
            Write-Output "::error::파이썬 3.12 가 아닙니다 ($v) — 딴 판으로 재면 결과가 어긋납니다"
            exit 1
          }

      # ★ **한글 글꼴을 깝니다** (2026-09-28)
      #   gate.yml 과 같은 까닭입니다. 우분투 러너에는 한글
      #   글꼴이 없어, 없이 재면 글자 너비가 달라집니다.
      - name: 한글 글꼴 깔기
      # ★ **우분투일 때만** 깝니다 (2026-09-30)
      #   셀프 호스티드 러너(윈도우)에는 한글 글꼴이 이미 있습니다.
      #   apt-get 은 윈도우에 없으므로 건너뜁니다.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-nanum locales
          # ★ **로케일을 실제로 깝니다** (2026-09-29 — 배포가 막혔습니다)
          #
          #   LC_ALL 에 ko_KR.UTF-8 을 적어 두었는데 러너에는 그
          #   로케일이 없었습니다. 그래서 이런 경고가 났고,
          #
          #       setlocale: LC_ALL: cannot change locale (ko_KR.UTF-8)
          #
          #   lftp 가 서버의 **한글 이름**을 물음표로 바꿔 못 찾았습니다.
          #
          #       550 ?????????: No such file or directory (/www/?????????)
          #
          #   되돌릴 것을 못 받아 배포가 그 자리에서 멈췄습니다.
          #   「적어 두었다」와 「깔려 있다」는 다릅니다 — 글꼴 때도
          #   같은 일을 겪었습니다.
          sudo locale-gen ko_KR.UTF-8
          sudo update-locale LANG=ko_KR.UTF-8
          locale -a | grep -i ko_KR || echo '::warning::ko_KR 로케일이 아직 없습니다'
          fc-cache -f >/dev/null 2>&1 || true
          if ! fc-list :lang=ko | grep -q .; then
            echo "::error::한글 글꼴이 없습니다 — 이대로 재면 값이 어긋납니다"
            exit 1
          fi

      - name: 크롬 깔기 (우분투)
        if: runner.os == 'Linux'
        uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      # ★ 윈도우에서는 **이미 깔린 크롬을 찾습니다**
      #   못 찾으면 거기서 멈춥니다 — 엣지로 슬쩍 넘어가지 않습니다
      #   (주인 규칙 25 — 엣지는 쓰지 않습니다).
      - name: 크롬 찾기 (윈도우)
        if: runner.os == 'Windows'
        id: chromewin
        shell: pwsh
        run: |
          $후보 = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
            "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe"
          )
          $찾음 = $후보 | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $찾음) {
            Write-Output "::error::크롬을 못 찾았습니다 — 엣지는 쓰지 않습니다 (주인 규칙 25)"
            exit 1
          }
          Write-Output "크롬 자리: $찾음"
          "chrome-path=$찾음" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: 쪽 만들기
        run: python engine/build.py

      # ── ③ FAST: 실제 배포에 필요한 최소 안전 확인만 수행
      # 장시간 전수 판정(gate.yml)은 QUALITY 점검으로 별도 실행합니다.
      # 운영 배포는 이 세 가지 점검이 하나라도 실패하면 중단합니다.
      - name: 변경 파일 필수 안전점검 (FAST)
        run: |
          set -e
          test -s site/stats.html
          test -s site/assets/js/stats.js
          grep -q 'st-range' site/stats.html
          node --check site/assets/js/stats.js
          python engine/check_private.py
          # 검수용 모의 통계를 운영 페이지로 실수로 배포하지 않습니다.
          if [ -e site/stats-review/index.html ]; then
            echo "::error::검수용 stats-review 페이지는 운영 배포 대상이 아닙니다"
            exit 1
          fi
          echo "FAST 필수 점검 통과 — 전체 전수판정은 별도 QUALITY에서 실행"

      # ── ④ 검증판 표시가 남아 있으면 안 됩니다
      - name: 검증판 표시가 없는지 봅니다
        run: |
          if grep -rl "badagaja:stage" site/ >/dev/null 2>&1; then
            echo "::error::검증판(_stage) 표시가 남아 있습니다"
            echo "  그대로 올리면 416쪽이 통째로 검색에서 사라집니다."
            exit 1
          fi
          echo "· 검증판 표시가 없습니다"

      - name: 배포판 지문 만들기
        run: python engine/build_id.py

      - name: lftp 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # ── ★ **아티팩트 사전확인** — 전환 2단계 (2026-10-08 바깥 검수)
      #
      #   「full backup 을 건너뛰기 **전에** 직전 성공판 artifact 가
      #     실제로 존재하는지 확인합니다. 단순히 build_id 만 맞는
      #     것이 아니라 **직전 public build_id == 직전 성공 artifact
      #     build_id** 이고, **artifact 메타데이터가 존재**하고,
      #     **그 안의 build.json/manifest 가 읽히는** 상태여야
      #     합니다. 이 셋 중 하나라도 불확실하면 **기존 FTP 전체
      #     백업으로 자동 fallback** 합니다」
      #
      #   ★ **아직 아무것도 건너뛰지 않습니다.** 묻기만 합니다.
      #     바로 아래 전체 백업(16분35초)이 그대로 돕니다.
      #     그림자가 연속 3회 같아진 **뒤에** 건너뛰기를 켭니다.
      #     돌려주는 값 — 0 괜찮음 · 3 모르겠음
      - name: 아티팩트 사전확인 (아직 건너뛰지 않습니다)
        id: preflight
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python engine/artifact_preflight.py && 값=0 || 값=$?
          echo "결과=$값" >> "$GITHUB_OUTPUT"
          if [ "$값" = "0" ]; then
            echo "· 괜찮습니다 — 다음 단계에서 건너뛸 수 있는 상태입니다"
          else
            echo "· 모르겠습니다 — 기존 전체 백업을 씁니다 (지금도 그렇습니다)"
          fi

      # ── ⑤ 되돌릴 것을 먼저 챙깁니다
      - name: 지금 서버를 내려받아 둡니다 (되돌리기용)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # ★ **사진도 받습니다** (2026-09-28 바깥 검수 10차)
          #
          #   처음에는 용량 때문에 img/ 를 뺐습니다. 그런데 그러면
          #
          #       배포 전  img/a.jpg = A
          #       배포 후  img/a.jpg = B
          #       되돌림   html·css·js 는 돌아오는데 a.jpg 는 B 그대로
          #
          #   **코드는 되돌렸는데 사이트는 안 되돌린 것**이 됩니다.
          #   재 보니 사진은 71MB·269장입니다. 받을 만합니다.
          #   「백업 파일이 있다」와 「그 백업으로 복구할 수 있다」는
          #   완전히 다른 이야기입니다.
          mkdir -p _before
          # ★ **숨은 파일까지 받습니다** (2026-10-07 바깥 검수 순서 ①)
          #
          #   `ftp:list-options -a` 가 없으면 lftp 는 서버 목록에서
          #   **점으로 시작하는 파일을 못 봅니다.** `.htaccess` 가
          #   그렇습니다.
          #
          #   되돌릴 때 `.htaccess` 가 없으면 **사이트가 500 으로
          #   멈춥니다.** 이미 두 번 겪은 자리입니다 (주인 규칙 27).
          #   「백업 파일이 있다」와 「그 백업으로 복구할 수 있다」는
          #   다릅니다.
          lftp -c "
            set ftp:ssl-allow no;
            set net:max-retries 3;
            set ftp:charset utf-8;
            set file:charset utf-8;
            set ftp:list-options -a;
            open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\";
            mirror --only-newer --parallel=4 --exclude-glob _stage/ /www/ _before/;
          " || {
            echo "::error::지금 서버를 다 못 받았습니다 — 되돌릴 것이 없으면 올리지 않습니다"
            exit 1
          }
          echo "받아 둔 파일 $(find _before -type f | wc -l)개 · $(du -sh _before | cut -f1)"
          # 받아 둔 것의 지문을 남깁니다 — 되돌린 뒤 견주려고
          (cd _before && find . -type f -exec sha256sum {} \; | sort) > _before.sha256
          echo "지문 $(wc -l < _before.sha256)줄"

          # ★ **서버와 받은 것을 견줍니다** (바깥 검수 순서 ②)
          #   「백업 완전성 + 삭제 계획을 증명하고 넣는 것이 맞습니다」
          #   이것이 증명되기 전에는 되돌리기에 --delete 를 넣지
          #   않습니다. 지금은 **재어 보기만** 합니다.
          lftp -c "
            set ftp:ssl-allow no;
            set net:max-retries 3;
            set ftp:charset utf-8;
            set file:charset utf-8;
            set ftp:list-options -a;
            open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\";
            find /www/;
          " > _server.list 2>/dev/null || true
          python engine/check_backup.py || true
          tar -czf _before.tgz _before _before.sha256

      - name: 되돌릴 것을 남겨 둡니다
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 배포전-서버
          path: _before.tgz
          retention-days: 30

      # ── ★ **올리기 전에 되돌림 계획을 재 둡니다** (2026-10-08에 겪음)
      #
      #   그림자 단계가 **올리기 뒤**에만 있었습니다. 그런데
      #   `rollback_plan.py` 는 **공개 `build.json`** 을 읽어 셈합니다.
      #   올린 뒤에는 공개 판이 곧 이번 판이라 —
      #
      #       공개 판 8ab8271 — 파일 926개
      #       이번 판 8ab8271 — 파일 926개
      #       새로 생김 0 · 바뀜 0 · 사라짐 0
      #
      #   **늘 차이 0** 이 나왔습니다. 「새 셈이 기존 계획과 같은가」를
      #   재려고 둔 것인데, 잴 것이 없는 자리에서 재고 있었습니다.
      #   배포 #39 로그에서 그대로 드러났습니다.
      #
      #   올리기 **전**에는 공개 판이 **지난 판**이라 진짜 차이가
      #   나옵니다. 그것이 기존 lftp 계획과 같아야 합니다.
      #   ★ 여기서도 **아무것도 바꾸지 않습니다.** 재어서 적어만 둡니다.
      - name: 그림자 ① 올리기 전 — 지난 판과의 차이를 0.2초에 셉니다
        continue-on-error: true
        run: |
          python engine/rollback_plan.py || true
          # 올린 뒤 것과 견주려고 따로 간수합니다
          if [ -f tests/out/되돌림계획.json ]; then
            cp tests/out/되돌림계획.json tests/out/되돌림계획-올리기전.json
            echo "· 올리기 전 계획을 간수했습니다"
          fi

      # ── 올리기 — 자산 먼저, 쪽 나중
      - name: 올리기
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "올릴 곳: /www/  (운영)"
          lftp -c "
            set ftp:ssl-allow no;
            set net:max-retries 3;
            set ftp:charset utf-8;
            set file:charset utf-8;
            open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\";
            echo '── 1단계: 자산 (꾸밈·움직임·그림)';
            mirror -R --only-newer --parallel=4 site/assets/ /www/assets/;
            mirror -R --only-newer --parallel=4 site/img/ /www/img/;
            echo '── 2단계: 쪽 (자산이 다 올라간 뒤에)';
            mirror -R --only-newer --parallel=4 --exclude-glob build.json --exclude assets/ --exclude img/ site/ /www/;
            echo '── 3단계: 판 지문 (이것이 올라가야 판이 바뀐 것)';
            put site/build.json -o /www/build.json;
          "
          echo "· 올렸습니다"

      # ★ 운영에서는 **--delete 를 쓰지 않습니다.**
      #   옛 쪽 22갈래를 남기기로 했고(keep.json), 솎다가 그것들을
      #   지우면 중국어판 190쪽이 통째로 깨집니다.
      #   쓸모없어진 파일은 손으로 확인하고 지웁니다.

      # ── ⑥ 올린 뒤 재고, 나쁘면 되돌립니다
      # ── ★ **되돌림 계획을 재 봅니다** (2026-10-07 바깥 검수 순서 ⑥⑦)
      #
      #   ★ 자리가 중요합니다. 제가 처음에 「백업 단계 직후」라고
      #     생각했는데 **반만 맞았습니다.**
      #
      #     바깥 검수 — 「그 시점에는 서버와 `_before` 가 사실상 같은
      #       상태라서, **새 배포가 추가한 파일을 삭제하는 실제
      #       rollback 상황을 재현하지 못합니다.** 삭제 예정 목록이
      #       거의 0 으로 나올 가능성이 큽니다. 가장 좋은 위치는
      #       **업로드가 끝난 직후 → post-deploy 검사 전**입니다」
      #
      #     그래야 **성공하는 배포에서도 매번 진짜 「새 판 → 옛 판」**
      #     되돌림 계획을 보게 됩니다. 되돌리기 단계는 배포가 실패해야만
      #     도니, 거기 두면 **영영 안 돌아 봅니다.**
      #
      #   ★ **아직 아무것도 지우지 않습니다.** --dry-run 입니다.
      # ── **그림자 재기** — 새 방식이 맞는지 나란히 봅니다 (2026-10-08)
      #
      #   주인 — 「배포에 시간이 너무 많이 걸려. 백업본 다운받고
      #   저장해버리면 간단할텐데」
      #
      #   재 보니 39분 가운데 서버 내려받기 10분 39초 + 되돌림 계획
      #   8분 54초 = **19분 33초(절반)** 가 되돌리기 준비였습니다.
      #   새 방식은 공개 `build.json`(95KB) 하나만 받아 **0.2초**에
      #   같은 것을 셉니다.
      #
      #   ★ 바깥 검수 — 「바로 기존을 지워버리기보다, 새 계산을 먼저
      #     **그림자 모드**로 몇 번 병행해 증명한 뒤 전환하십시오.
      #     사람 눈으로 『비슷하다』가 아니라 **집합이 정확히 같아야**
      #     합니다」
      #
      #   그래서 여기서는 **재기만** 합니다. 기존 백업도, 기존 되돌림
      #   계획도 **하나도 안 건드립니다.** 몇 번 나란히 돌려 늘 같은
      #   것을 본 뒤에 바꿉니다.
      - name: 그림자 — 새 되돌림 계획을 0.2초에 재 봅니다
        if: always()
        continue-on-error: true
        run: |
          python engine/rollback_plan.py || true
          echo ""
          echo "※ 이것은 **재기만** 한 것입니다. 실제 백업과 되돌림"
          echo "   계획은 아래 기존 단계가 그대로 합니다."

      - name: 되돌림 계획을 재 봅니다 (아직 안 지웁니다)
        id: rollplan
        # ★ 여기서 바로 멈추면 **20번 검증이 안 돕니다** (2026-10-07)
        #   올린 것이 서버에서 멀쩡한지 보는 것이 20번입니다. 되돌림
        #   준비가 덜 됐다고 그것까지 건너뛰면 **더 모르는 상태**가
        #   됩니다. 그래서 여기서는 재기만 하고, **20번을 돌린 뒤**에
        #   아래 「되돌림 준비가 됐는가」 에서 막습니다.
        #   지금은 되돌리기에 --delete 가 없어 **멈춰도 안전**합니다.
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "── 올린 뒤 서버 목록을 다시 뜹니다"
          lftp -c "
            set ftp:ssl-allow no;
            set net:max-retries 3;
            set ftp:charset utf-8;
            set file:charset utf-8;
            set ftp:list-options -a;
            open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\";
            find /www/;
          " > _server-after.list 2>/dev/null || true
          echo "   줄 $(wc -l < _server-after.list)"

          echo ""
          echo "── lftp 는 무엇을 지우겠다는가 (--dry-run · 안 지웁니다)"
          lftp -c "
            set ftp:ssl-allow no;
            set net:max-retries 3;
            set ftp:charset utf-8;
            set file:charset utf-8;
            set ftp:list-options -a;
            open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\";
            mirror -R --delete --exclude-glob _stage/ --dry-run _before/ /www/;
          " > rollback-plan.txt 2>&1 || true
          echo "   줄 $(wc -l < rollback-plan.txt)"

          echo ""
          # ★ **판정은 내 셈이 합니다** — lftp 글은 교차검증입니다
          #   「작은 문자열 처리 하나가 .htaccess 를 망가뜨렸습니다」
          python engine/check_backup.py --strict

          echo ""
          echo "── 그림자: 새 셈(0.2초)이 이 계획과 **집합이 같은가**"
          # ★ 바깥 검수 — 「사람 눈으로 『비슷하다』가 아니라
          #   new_plan == old_plan 이어야 합니다」
          #   달라도 **여기서는 안 막습니다.** 기존 방식이 그대로
          #   일하고 있고, 이것은 아직 재 보는 중입니다.
          python engine/shadow_compare.py || true
      - name: 올린 것을 서버에서 확인 (20번)
        id: after
        run: |
          python engine/check_deployed.py --net --strict
          python engine/smoke.py --net
          # ★ 2026-10-09 감독팀 지시 ③ — 운영 주소에서 **직접** 다시 잽니다
          #   「실패 시 『페이지가 보인다』로 성공 처리하지 말고 어느
          #    항목이 안 붙었는지 명시. Pillow·확대 버튼은 운영에서
          #    다시 재기 전까지 완료로 닫지 마세요」
          python engine/check_live_after_deploy.py             --바라는커밋 "${GITHUB_SHA}"
          # ★ 확대 단추 34번 — 감독팀 합격선 (17쪽 × PC·휴대폰)
          #   「운영에서 다시 재기 전까지 완료로 닫지 마세요」
          python engine/check_live_rigpage.py

      # ── ★ **되돌림 준비가 됐는가** — 20번을 돌린 뒤에 막습니다
      #   바깥 검수 — 「위험한가(지울것) 가 하나라도 나오면 **그 즉시
      #   배포 workflow 를 실패시키세요**. 아직 이 단계에서는 실제
      #   삭제는 안 합니다」 · 「**절대로 『경고만 하고 계속』하지
      #   마세요**」
      - name: 되돌림 준비가 됐는가
        if: always() && steps.rollplan.outcome == 'failure'
        run: |
          echo "::error::되돌릴 준비가 안 됐습니다 — 위 「되돌림 계획」 칸을 보십시오"
          echo ""
          echo "  올린 판 자체는 판정을 통과했고 서버에서도 쟀습니다."
          echo "  막는 까닭은 **되돌려야 할 때 되돌리지 못할 상태**이기"
          echo "  때문입니다. 백업에 빠진 것이 있거나, 되돌릴 때 지우면"
          echo "  안 되는 것(.htaccess·api/·중국어판)이 삭제 목록에"
          echo "  들어 있습니다."
          echo ""
          echo "  「백업 파일이 있다」와 「그 백업으로 복구할 수 있다」는"
          echo "  다릅니다. 다음 배포 전에 고쳐야 합니다."
          exit 1
      - name: 나쁘면 되돌립니다
        if: failure() && steps.after.conclusion == 'failure'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "::warning::올린 뒤 검사가 나빠 되돌립니다"
          if [ ! -d _before ] || [ -z "$(ls -A _before 2>/dev/null)" ]; then
            echo "::error::되돌릴 것이 없습니다 — 손으로 고쳐야 합니다"
            exit 1
          fi
          lftp -c "
            set ftp:ssl-allow no;
            set net:max-retries 3;
            set ftp:charset utf-8;
            set file:charset utf-8;
            open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\";
            mirror -R --parallel=4 _before/ /www/;
          "
          echo "· 파일을 되돌렸습니다."
          echo ""
          # ★ **되돌리기는 FTP 복사가 아니라 하나의 배포입니다**
          #   (2026-09-28 바깥 검수 10차)
          #   파일이 돌아왔다고 성공이 아닙니다. 사이트가 살아났는지
          #   봐야 합니다. 안 보면 「되돌렸는데 여전히 깨진」 상태를
          #   모른 채 넘어갑니다.
          echo "── 되돌린 뒤에도 사이트가 살아 있는지 봅니다"
          BAD=0
          python engine/smoke.py --net || BAD=1
          for U in / /taean.html /robots.txt /sitemap.xml \
                   /css/style.css /js/app.js /zh-cn/; do
            C=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 \
                "https://badagaja.com$U")
            printf '   %-18s %s\n' "$U" "$C"
            [ "$C" = "200" ] || BAD=1
          done
          if [ "$BAD" != "0" ]; then
            echo "::error::**되돌렸는데도 사이트가 성치 않습니다** — 손으로 봐야 합니다"
            exit 1
          fi
          echo "· 되돌렸고 사이트가 살아 있습니다. 왜 나빴는지 보고 다시 하세요."

      # ── ★ **올린 판을 봉해 둡니다** (2026-10-07 바깥 검수)
      #
      #   되돌리기용 백업을 서버에서 통째로 받느라 **11분 10초**가
      #   듭니다. 판정(12분 50초)과 거의 맞먹습니다. 34분 가운데
      #   둘이 24분입니다.
      #
      #   까닭은 `--only-newer` 였습니다. 러너는 **매번 새로 뜨므로**
      #   `_before/` 가 늘 비어 있어 매번 115MB 를 통째로 받습니다.
      #   그런데 그 115MB 는 **우리가 만들어 올린 바로 그것**입니다
      #   (site/ 가 115MB · 그중 img/ 가 96MB).
      #
      #   바깥 검수가 정해 준 차례 —
      #     ① 검증된 site/ release artifact 를 **지금부터 매 배포 보관**
      #     ② artifact 에 build_id · commit · SHA256 · manifest ·
      #        gate 결과 저장
      #     ③ 이전/새 artifact 로 **되돌리기 재현 시험**
      #     ④ **새 파일 삭제까지 포함해** exact rollback 검증
      #     ⑤ 서버 build_id 가 known previous release 와 **일치할
      #        때만** 전체 FTP 백업 생략
      #     ⑥ 일치하지 않으면 **기존 11분 full backup 으로 되돌아감**
      #
      #   ★ 지금은 **①②만** 합니다 — 쌓기만 하고 백업은 그대로 둡니다.
      #     ③④가 통과하기 전에는 **한 푼도 생략하지 않습니다.**
      #     「백업 파일이 있다」와 「그 백업으로 복구할 수 있다」는
      #     다릅니다 — 이미 한 번 겪은 자리입니다(그래서 사진까지
      #     받게 되었습니다).
      - name: 올린 판을 봉해 둡니다 (다음 배포가 되돌릴 바탕)
        if: success()
        run: |
          mkdir -p _release
          # ★ build.json 에 이미 **커밋·전체 지문·파일마다의 SHA-256**
          #   이 들어 있습니다 (engine/build_id.py). 그것이 manifest 입니다.
          cp site/build.json _release/build.json
          # FAST 배포에는 전수 판정표가 없으므로 존재할 때만 보관합니다.
          if [ -f tests/out/gate.json ]; then cp tests/out/gate.json _release/gate.json; fi
          cp tests/out/deployed.json _release/deployed.json 2>/dev/null || true
          tar -czf _release/site.tgz site
          echo "봉한 것 $(du -sh _release | cut -f1)"
          # ★ heredoc 은 YAML 블록 안에서 들여쓰기에 걸리기 쉽습니다 —
          #   한 줄짜리로 둡니다.
          python engine/build_id.py --보기

      - name: 봉한 판 남기기
        if: success()
        uses: actions/upload-artifact@v4
        with:
          # ★ 커밋을 이름에 넣습니다 — 다음 배포가 **찾아 쓸** 이름입니다
          name: 배포판-${{ github.sha }}
          path: _release
          retention-days: 30
      - name: 결과 남기기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 운영배포결과
          path: |
            tests/out/*.json
            tests/out/log/*.txt
          retention-days: 90

      - name: 다음에 할 일
        if: success()
        run: |
          echo "· 배포가 끝났습니다."
          echo ""
          echo "  남은 일 (손으로)"
          echo "    1. 네이버 서치어드바이저에 사이트맵 다시 제출"
          echo "    2. 구글 서치콘솔에 사이트맵 다시 제출"
          echo "    3. /www/_stage/ 를 지웁니다 (검증판이 검색에 걸리지 않게)"
          echo "    4. 며칠간 검색 유입을 지켜봅니다"
