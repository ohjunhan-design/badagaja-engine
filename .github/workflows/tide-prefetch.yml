# 물때 미리 받기 — 손님이 정부 API 를 기다리지 않게 합니다
#
# ★ 왜 (2026-10-14 주인 의견 · 총감독 지휘)
#   손님이 올 때마다 서버가 정부 API 를 하루치씩 부르는 구조였습니다.
#   정부 API 는 건강할 때 70ms 인데 **간헐적으로 응답이 없습니다** —
#   같은 주소가 1.97초였다 133초였다 합니다. 그걸 손님이 그대로 맞아
#   강화에서 **32초**를 기다린 손님이 있었습니다.
#
#   간조·만조는 **천문 계산값이라 변하지 않습니다.** 그래서 가끔 한 번
#   받아 파일로 두고, 손님은 그 파일만 읽게 합니다.
#
# ★ 지금은 **손으로만 돌립니다.** 정기 실행(schedule)은 아래에 적어
#   두었지만 **꺼 두었습니다** — 스케줄러 승인을 받은 뒤에 켭니다.
name: 물때 미리 받기

on:
  workflow_dispatch:
    inputs:
      days:
        description: '며칠치를 받을까요 (기본 30)'
        required: false
        default: '30'
      region:
        description: '한 곳만 시험하려면 권역 id (비우면 전부)'
        required: false
        default: ''
# ★ 승인 뒤에 아래 주석을 풀면 이틀마다 새벽 5시(한국)에 돕니다.
#   schedule:
#     - cron: '0 20 */2 * *'    # 20:00 UTC = 다음날 05:00 KST

permissions:
  contents: write

concurrency:
  group: tide-prefetch
  cancel-in-progress: false

jobs:
  받기:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 받기 전 상태
        run: python -m engine.fetch_tide --확인

      - name: 물때 받기
        env:
          # ★ 이 암호는 **정부 열쇠가 아닙니다.** 호출 한도를 지키려는
          #   문지기입니다. 비밀값에 두면 주소에 안 드러납니다.
          BADAGAJA_TIDE_ADMIN: ${{ secrets.BADAGAJA_TIDE_ADMIN }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.region }}" ]; then
            ARGS="--권역 ${{ github.event.inputs.region }}"
          fi
          DAYS="${{ github.event.inputs.days }}"
          if [ -z "$DAYS" ]; then DAYS=30; fi
          python -m engine.fetch_tide --날수 "$DAYS" $ARGS

      - name: 받은 뒤 상태
        if: always()
        run: python -m engine.fetch_tide --확인

      - name: 바뀐 것이 있으면 저장소에 남기기
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tide || true
          if git diff --cached --quiet; then
            echo "바뀐 것이 없습니다 — 아무것도 올리지 않습니다"
          else
            git commit -m "물때를 미리 받았습니다 (자동)"
            git push
          fi

      - name: 받은 것 묶어 두기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tide-json
          path: data/tide/*.json
          if-no-files-found: ignore
          retention-days: 7
