# 판정 — 깃허브 액션(클라우드)에서 돌립니다   (2026-09-27 주인 승인)
#
# ★ 왜 클라우드인가
#
#   내 컴퓨터는 메모리 31.8GB 중 커널이 28GB 를 쥐고 있어
#   쓸 수 있는 것이 3.4GB 뿐입니다. 주인이 컴퓨터를 만질 수 없는
#   자리에 계셔 재시동도 못 합니다.
#
#   그 형편에서 판정을 돌렸더니 MemoryError 로 검사기 다섯이
#   넘어져, **멀쩡한 쪽이 FAIL 로 찍혔습니다.**
#
#   바깥 검수(GPT 5차)가 이렇게 지적했습니다.
#       「검수 시스템이 환경에 따라 다른 결과를 내놓을 수 있다.
#         그러면 판정이 무슨 뜻입니까?」
#
#   러너는 매번 **같은 이미지에서 새로** 뜹니다. 내 찌꺼기도,
#   주인 크롬도, 메모리를 쥔 커널도 없습니다.
#   「같은 판 = 같은 결과」가 저절로 지켜집니다.
#
# ★ 한꺼번에 돌리지 않고 **하나씩(--serial)** 돌립니다
#   바깥 검수 지시 — 「병렬화하지 말고 먼저 깨끗한 환경에서
#   기준 결과를 확보하십시오」. 병렬은 결정성이 증명된 다음입니다.
name: 배포 판정

on:
  workflow_dispatch:          # 손으로 돌립니다
    inputs:
      mode:
        description: '하나씩(serial) 또는 한꺼번에(parallel)'
        required: false
        default: serial
        type: choice
        options: [serial, parallel]
  push:
    branches: [main]

permissions:
  contents: read

# ★ 이름·아이디는 **영어여야 합니다** (2026-09-28)
#
#   처음 세 판이 통째로 안 떴습니다. 까닭은 이것이었습니다.
#
#       Invalid workflow file: .github/workflows/gate.yml#L1
#       Unexpected symbol: '크롬'
#           steps.크롬.outputs.chrome-path
#
#   깃허브 액션의 식(expression)은 **한글 이름을 못 씁니다.**
#   `id: 크롬` 을 `steps.크롬` 으로 부르니 파일이 아예 안 읽혔습니다.
#   `inputs.모드` 도 같습니다.
#
#   환경변수 이름 때와 같은 이야기입니다 — 리눅스 셸도, 깃허브
#   액션 식도 한글을 못 씁니다. **`name:` 과 주석은 한글로 두되,
#   `id:`·`inputs:` 의 열쇠는 영어로** 적습니다.
#
#   ★ 그런데 바로 이 글 아래에서 **같은 잘못을 또 했습니다.**
#     (2026-09-28 — 여섯 번을 돌려 여섯 번 다 실패했습니다)
#
#       jobs:
#         판정:          ← 일 이름도 식별자입니다
#
#     깃허브는 파일을 아예 안 읽고 이렇게만 말합니다.
#
#       The identifier '판정' is invalid.
#
#     **판정이 돈 적이 없는데 저는 「돌고 있다」고 여겼습니다.**
#     실패 여섯 줄이 목록에 있었으나, 실패 이유가 판정 결과인 줄
#     알았습니다. 파일이 안 읽히면 판정은 시작조차 안 합니다.
#     → engine/check_architecture.py 가 이제 한글 식별자를 잡습니다.

jobs:
  gate:
    name: 판정
    # ★ 어느 컴퓨터에서 돌지 **한 곳에서 정합니다** (2026-09-30)
    #   저장소 변수 RUNNER_LABEL 이 있으면 그것을 씁니다.
    #   없으면 예전처럼 깃허브 우분투입니다.
    #   셀프 호스티드 러너를 붙이면 RUNNER_LABEL 에
    #   self-hosted 를 넣기만 하면 됩니다 — 일꾼 파일은
    #   다시 안 고칩니다.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    # ★ **셸을 bash 로 못 박습니다** (2026-09-30)
    #
    #   윈도우 러너에서는 `run:` 이 기본으로 **파워셸**로 돕니다.
    #   그런데 우리 일꾼 글은 전부 셸(bash) 문법입니다.
    #       if [ -z "$X" ]; then …
    #   파워셸은 이것을 못 읽고 「'if' 뒤에 '('가 없습니다」로 죽습니다.
    #
    #   윈도우에도 **깃 배시**가 있어 bash 를 쓸 수 있습니다.
    #   이렇게 못 박으면 **우분투와 윈도우가 같은 글을 씁니다** —
    #   일꾼을 두 벌로 나누지 않아도 됩니다.
    #
    #   파워셸이 꼭 필요한 단계(크롬 찾기·파이썬 보기)는
    #   그 단계에만 `shell: pwsh` 를 따로 적었습니다.
    defaults:
      run:
        shell: bash
    # ★ **일꾼 한도는 검사기 한도보다 넉넉해야 합니다** (2026-09-28)
    #
    #   60분이었는데, 검사기 하나에 120분(시간=7200)을 주고
    #   있었습니다. 그러면 일꾼이 먼저 죽습니다.
    #
    #   그때는 **판정 결과가 아예 안 남습니다.**
    #   거짓 판정이 판정 없는 것보다 나쁘다고 했는데, 이건
    #   그보다도 못합니다 — 왜 죽었는지조차 모릅니다.
    #
    #   크롬 깃발을 고치자 416쪽을 진짜로 재기 시작했고,
    #   그래서 5분이던 판정이 40분을 넘겼습니다. 제대로 재면
    #   오래 걸리는 것이 맞습니다. 한도를 거기에 맞춥니다.
    timeout-minutes: 180

    # ★ 환경을 못 박습니다 (2026-09-28 바깥 검수 6차 지시)
    #
    #   「OS · 브라우저 · 판 · 뷰포트 · DPR · 글꼴 · 로케일 · 시간대를
    #     CI 에서 고정하십시오. Golden 은 그 환경에서만 만듭니다」
    #
    #   물때는 시간대에 따라 답이 달라집니다. 러너 기본은 UTC 라
    #   한국 시각으로 재지 않으면 **하루가 밀립니다.**
    env:
      TZ: Asia/Seoul
      LANG: ko_KR.UTF-8
      LC_ALL: ko_KR.UTF-8
      # ★ **옛 사이트를 저장소 안에서 봅니다** (2026-09-28)
      #   클라우드에는 옛 사이트가 없어, 검사기 셋이
      #   「볼 것이 0개 = 걸린 것도 0개」로 조용히 통과했습니다.
      #   engine/make_oldsite.py 로 떠 둔 쪽을 봅니다.
      BADAGAJA_OLD: ${{ github.workspace }}/oldsite
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: '1'

    steps:
      - uses: actions/checkout@v4

      # ★ **우분투일 때만 깝니다** (2026-09-30)
      #   setup-python 도 윈도우에서 레지스트리를 건드려
      #   관리자가 아닌 셀프 호스티드 러너에서는 죽습니다.
      #   내 컴퓨터에는 파이썬 3.12 가 이미 있습니다.
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: '3.12'

      # ★ 윈도우에서는 **있는 파이썬이 쓸 만한지 봅니다**
      #   3.12 가 아니면 거기서 멈춥니다 — 딴 판으로 재면
      #   내 컴퓨터와 결과가 어긋납니다.
      - name: 파이썬 보기 (윈도우)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = (python --version 2>&1) -replace 'Python ',''
          Write-Output "파이썬 $v"
          if (-not $v.StartsWith('3.12')) {
            Write-Output "::error::파이썬 3.12 가 아닙니다 ($v) — 딴 판으로 재면 결과가 어긋납니다"
            exit 1
          }

      # ★ **한글 글꼴을 깝니다** (2026-09-28)
      #
      #   위 주석에 「글꼴을 고정한다」고 적어 두고 **정작 깔지
      #   않고 있었습니다.** 적어 놓은 것과 하는 것이 달랐습니다.
      #
      #   우분투 러너에는 한글 글꼴이 없습니다. 그러면 크롬이
      #   한글을 대체 글꼴로 그리고, 글자 너비가 달라져
      #   줄바꿈·누름자리 크기가 내 컴퓨터와 어긋납니다.
      #
      #   그래서 4번(416쪽 렌더링)이 내 컴퓨터에서는 탈이 없는데
      #   클라우드에서만 「손볼 곳 4건」이라 했습니다.
      #   **쪽이 잘못된 것이 아니라 재는 자리가 달랐던 것**입니다.
      - name: 한글 글꼴 깔기
      # ★ **우분투일 때만** 깝니다 (2026-09-30)
      #   셀프 호스티드 러너(윈도우)에는 한글 글꼴이 이미 있습니다.
      #   apt-get 은 윈도우에 없으므로 건너뜁니다.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-nanum locales
          sudo locale-gen ko_KR.UTF-8 >/dev/null 2>&1 || true
          sudo update-locale LANG=ko_KR.UTF-8 >/dev/null 2>&1 || true
          fc-cache -f >/dev/null 2>&1 || true
          echo "깔린 한글 글꼴"
          fc-list :lang=ko family | sort -u | head -8
          if ! fc-list :lang=ko | grep -q .; then
            echo "::error::한글 글꼴이 없습니다 — 이대로 재면 값이 어긋납니다"
            exit 1
          fi

      # 크롬 — 러너에 미리 깔려 있지만 자리를 못 박습니다.
      # 엣지는 쓰지 않습니다 (주인 규칙 25)
      #
      # ★ **우분투일 때만 깝니다** (2026-09-30)
      #   setup-chrome 은 윈도우에서 레지스트리를 건드리는데,
      #   관리자가 아닌 셀프 호스티드 러너에서는 권한이 없어
      #   「Requested registry access is not allowed」로 죽습니다.
      #   내 컴퓨터에는 크롬이 이미 깔려 있으니 그것을 씁니다.
      - name: 크롬 깔기 (우분투)
        if: runner.os == 'Linux'
        uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      # ★ 윈도우에서는 **이미 깔린 크롬을 찾습니다**
      #   못 찾으면 거기서 멈춥니다 — 엣지로 슬쩍 넘어가지 않습니다
      #   (주인 규칙 25 — 엣지는 쓰지 않습니다).
      - name: 크롬 찾기 (윈도우)
        if: runner.os == 'Windows'
        id: chromewin
        shell: pwsh
        run: |
          $후보 = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
            "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe"
          )
          $찾음 = $후보 | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $찾음) {
            Write-Output "::error::크롬을 못 찾았습니다 — 엣지는 쓰지 않습니다 (주인 규칙 25)"
            exit 1
          }
          Write-Output "크롬 자리: $찾음"
          "chrome-path=$찾음" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # ★ 크롬이 **정말 도는지 먼저 봅니다** (2026-09-28)
      #
      #   클라우드 판정이 처음 돌았을 때 5·9·10번이 모두
      #   「못 쟀습니다」로 FAIL 이었습니다. 크롬을 깔았다고
      #   나오는데 검사기는 못 쓰고 있었습니다.
      #
      #   깔렸다는 말과 돌아간다는 말은 다릅니다.
      #   **여기서 한 번 돌려 보고, 안 되면 거기서 멈춥니다.**
      #   못 쓰는 크롬으로 20분 돌린 뒤 「못 쟀습니다」를 받는 것은
      #   시간도 잃고 무엇이 틀렸는지도 안 알려 줍니다.
      - name: 크롬이 정말 도는가
        env:
          # ★ 우분투는 setup-chrome, 윈도우는 찾은 자리 (2026-09-30)
          BADAGAJA_CHROME: ${{ steps.chrome.outputs.chrome-path || steps.chromewin.outputs.chrome-path }}
        run: |
          echo "크롬 자리: [$BADAGAJA_CHROME]"
          if [ -z "$BADAGAJA_CHROME" ]; then
            echo "::error::크롬 자리가 비었습니다"
            exit 1
          fi
          # ★ **--version 으로 재지 않습니다** (2026-09-30)
          #   윈도우 크롬은 --version 을 콘솔에 안 찍고 조용히 끝납니다.
          #   「도는가」는 **쪽을 그려 보는 것**으로만 잽니다.
          echo '<!doctype html><title>t</title><p>바다</p>' > /tmp/t.html
          # ★ 윈도우 크롬은 깃 배시의 /tmp 를 **모릅니다**.
          #   cygpath 로 윈도우 꼴 주소로 바꿔 줍니다.
          if command -v cygpath >/dev/null 2>&1; then
            TFILE=$(cygpath -m /tmp/t.html)
          else
            TFILE=/tmp/t.html
          fi
          echo "시험 쪽: file:///$TFILE"
          "$BADAGAJA_CHROME" --headless=new --disable-gpu --no-sandbox \
            --virtual-time-budget=4000 --dump-dom "file:///$TFILE" \
            > /tmp/t.out 2>/tmp/t.err || true
          if grep -q '바다' /tmp/t.out; then
            echo "· 크롬이 쪽을 그려 냅니다 (한글도 제대로)"
          else
            echo "::error::크롬이 쪽을 못 그립니다"
            head -20 /tmp/t.err
            exit 1
          fi
          python engine/machine.py

      - name: 어떤 컴퓨터에서 재는지 남기기
        run: python engine/machine.py
        env:
          BADAGAJA_CHROME: ${{ steps.chrome.outputs.chrome-path || steps.chromewin.outputs.chrome-path }}

      - name: 쪽 만들기
        run: python engine/build.py
        env:
          BADAGAJA_CHROME: ${{ steps.chrome.outputs.chrome-path || steps.chromewin.outputs.chrome-path }}

      # ★ 멱등성(두 번 만들어 같은가)은 계약-07 이 판정 안에서
      #   봅니다 — 딴 자리에 새로 만들어 바이트까지 견줍니다.
      #   여기서 또 돌리지 않습니다.
      - name: 배포판 지문 만들기
        run: python engine/build_id.py

      - name: 판정
        run: |
          MODE="--serial"
          if [ "${{ github.event.inputs.mode }}" = "parallel" ]; then
            MODE=""
          fi
          python engine/gate.py --full $MODE --json
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: '1'      # 진행이 실시간으로 보이게
          BADAGAJA_CHROME: ${{ steps.chrome.outputs.chrome-path || steps.chromewin.outputs.chrome-path }}
          BADAGAJA_CHROMES: '3'
          BADAGAJA_JOBS: '1,3'

      # ★ **판정표를 요약 칸에 씁니다** (2026-09-29)
      #   로그는 접혀 있고 가운데가 잘려, 무엇이 어겼는지
      #   보려고 한참 뒤져야 했습니다. 요약 칸에 표로 올리면
      #   판정 쪽을 열자마자 보입니다.
      #   요약을 못 써도 판정을 뒤엎지 않습니다(끝난값 0).
      - name: 판정표를 요약에 쓰기
        if: always()
        run: python engine/summary.py
        env:
          PYTHONIOENCODING: utf-8

      - name: 판정 결과 남기기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 판정결과
          # ★ **검사기가 뱉은 말을 통째로 남깁니다** (2026-09-28)
          #   4번이 「손볼 곳 4건」이라 했는데 그 4건이 무엇인지
          #   볼 수가 없었습니다. 판정표는 한 줄 요약뿐이고,
          #   전문은 tests/out/log/ 에 있는데 여기 안 담겼습니다.
          #   **원인을 못 보면 고칠 수도 없습니다.**
          #
          #   (주석은 path: | 블록 **밖**에 둡니다. 리터럴 블록
          #    안에서는 # 이 주석이 아니라 글자 그대로 값이 되어
          #    설명글이 경로 패턴이 됩니다.)
          path: |
            tests/out/gate.json
            tests/out/*.txt
            tests/out/log/*.txt
          retention-days: 30
